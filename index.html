<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геолокация</title>
</head>
<body>
    <h2>Определение геолокации</h2>
    <p id="status">Запрашиваю координаты...</p>

    <script>
        function sendPoint(lat, lon) {
            fetch('/api/location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lon: lon })
            }).catch(function (e) {
                document.getElementById('status').textContent = 'Ошибка отправки: ' + e;
            });
        }

        function getAndSend() {
            if (!navigator.geolocation) {
                document.getElementById('status').textContent =
                    'Геолокация не поддерживается браузером.';
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    var lat = pos.coords.latitude;
                    var lon = pos.coords.longitude;
                    document.getElementById('status').textContent =
                        'Координаты получены: ' + lat.toFixed(6) + ', ' + lon.toFixed(6);
                    sendPoint(lat, lon);
                },
                function (err) {
                    document.getElementById('status').textContent =
                        'Геолокация недоступна: ' + err.message + ' (код ' + err.code + ')';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Сразу при открытии страницы
        getAndSend();

        // Раз в час, пока страница открыта
        setInterval(getAndSend, 3600 * 1000);
    </script>
</body>
</html>
