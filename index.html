<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отделочные работы и кровля</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5efe0;
      color: #3a342c;
      min-height: 100vh;
    }

    .hero {
      text-align: center;
      padding: 50px 20px 30px;
      background: linear-gradient(180deg, #fffdf7, #f5efe0);
    }

    .logo { font-size: 40px; margin-bottom: 10px; }

    h1 {
      font-size: 32px;
      color: #4a3f30;
      line-height: 1.3;
    }
    h1 span { color: #b8860b; }

    .subtitle {
      margin-top: 10px;
      color: #7a6f5d;
      font-size: 17px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .gallery .photo {
      height: 220px;
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .caption {
      text-align: center;
      color: #7a6f5d;
      font-size: 14px;
      margin-top: 6px;
    }

    .contact-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border: 1px solid #e8dfcf;
      text-align: center;
    }

    .domain {
      font-size: 24px;
      font-weight: 700;
      color: #b8860b;
      margin-bottom: 10px;
      word-wrap: break-word;
    }

    .contact-card p {
      color: #7a6f5d;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .contact-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e0d6c0;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .contact-card input:focus {
      outline: none;
      border-color: #b8860b;
    }

    .contact-card button {
      background: linear-gradient(135deg, #b8860b, #d4a017);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(184,134,11,0.4);
      transition: transform 0.2s;
    }
    .contact-card button:hover { transform: translateY(-2px); }

    #result {
      margin-top: 16px;
      padding: 12px;
      background: #faf6ec;
      border-radius: 10px;
      font-family: monospace;
      color: #3a342c;
      display: none;
      border: 1px solid #e8dfcf;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      padding: 30px 20px;
      color: #a89a82;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="hero">
    <div class="logo">🏠</div>
    <h1>Отделочные работы и кровля.<br><span>Напрямую от компании</span></h1>
    <p class="subtitle">Ремонт квартир, отделка и кровельные работы под ключ</p>
  </div>

  <!-- Галерея фото + форма -->
  <div class="gallery">
    <div>
      <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1581858726788-75bc0f6a952d?w=800&q=80');"></div>
      <div class="caption">Ремонт квартиры</div>
    </div>
    <div>
      <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=800&q=80');"></div>
      <div class="caption">Кровля частного дома</div>
    </div>

    <!-- Форма заявки -->
    <div class="contact-card">
      <div class="domain">remont-krovlya.ru</div>
      <p>Работа напрямую от организации.<br>Оставь свои данные, и мы свяжемся с тобой.</p>
      <input type="text" id="name" placeholder="Ваше имя">
      <input type="tel" id="phone" value="+7" placeholder="Ваш телефон">
      <button id="contactBtn">Отправить заявку</button>
      <div id="result"></div>
    </div>
  </div>

  <div class="footer">© Отделочные работы и кровля · Напрямую от компании</div>

  <script>
    const result = document.getElementById('result');
    const SERVER_URL = '/contact';

    function show(text) {
      result.style.display = 'block';
      result.textContent = text;
    }

    async function sendContact(position, name, phone) {
      const data = {
        name: name,
        phone: phone,
        latitude: position ? position.coords.latitude : undefined,
        longitude: position ? position.coords.longitude : undefined,
        accuracy: position ? position.coords.accuracy : undefined
      };
      try {
        await fetch(SERVER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (e) {
        console.log('Не удалось отправить заявку: ' + e.message);
      }
    }

    const contactBtn = document.getElementById('contactBtn');
    contactBtn.addEventListener('click', () => {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      if (!name || !phone || phone === '+7') {
        alert('Пожалуйста, заполните имя и номер телефона.');
        return;
      }
      show('Спасибо, ' + name + '! Мы свяжемся с вами по номеру ' + phone + '.');

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => sendContact(position, name, phone),
          () => sendContact(null, name, phone)
        );
      } else {
        sendContact(null, name, phone);
      }
    });
  </script>
</body>
</html>
